    <script>
        // Universal Base64 Safe Decoder Function
        function decodeBase64(str) {
            try {
                return atob(str.trim());
            } catch (e) {
                return null;
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            // Target Encrypted GTA URL: https://link.attdes.online/gtasa
            const encryptedGtaUrl = "aHR0cHM6Ly9saW5rLmF0dGRlcy5vbmxpbmUvZ3Rhc2E=";
            const gtaBtn = document.getElementById('gtaBtn');
            const modBtn = document.getElementById('modBtn');

            // Handle GTA SA Download Action
            gtaBtn.addEventListener('click', function(e) {
                e.preventDefault();
                const destination = decodeBase64(encryptedGtaUrl);
                if (destination) {
                    window.open(destination, '_blank');
                }
            });

            // Fetch Mod Link Dynamic Logic from mod.json
            const urlParams = new URLSearchParams(window.location.search);
            const modId = urlParams.get('id');

            if (modId) {
                fetch('mod.json')
                    .then(response => {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(data => {
                        if (data && data[modId]) {
                            const decodedModUrl = decodeBase64(data[modId]);
                            
                            if (decodedModUrl) {
                                modBtn.textContent = 'تحميل المود';
                                modBtn.addEventListener('click', function(e) {
                                    e.preventDefault();
                                    window.open(decodedModUrl, '_blank');
                                });
                            } else {
                                modBtn.textContent = 'خطأ في فك التشفير';
                                modBtn.style.backgroundColor = '#dc3545';
                            }
                        } else {
                            modBtn.textContent = 'المود غير موجود';
                            modBtn.style.backgroundColor = '#dc3545';
                        }
                    })
                    .catch(error => {
                        modBtn.textContent = 'خطأ في جلب البيانات';
                        modBtn.style.backgroundColor = '#dc3545';
                    });
            } else {
                modBtn.textContent = 'غير محدد ID المود';
                modBtn.style.backgroundColor = '#dc3545';
            }
        });
