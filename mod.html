<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ATT/DES - Maher Mods</title>

  <style>

    :root {
      --bg: #09090b;
      --card: #18181b;
      --accent: #facc15;
      --accent-hover: #eab308;
      --green: #22c55e;
      --green-hover: #16a34a;
      --text: #f8fafc;
      --border: #27272a;
      --muted: #a1a1aa;
      --error: #f87171;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      margin: auto;
      text-align: center;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      margin-bottom: 18px;
    }

    .brand {
      color: var(--accent);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .sub-brand {
      color: var(--muted);
      font-size: 0.9rem;
    }

    /* =========================
       SCROLL BOX
    ========================= */

    .hero-scroll {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .hero-scroll p {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 14px;
    }

    .arrows {
      font-size: 1.5rem;
      color: var(--accent);
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {

      0%,
      20%,
      50%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(8px);
      }

      60% {
        transform: translateY(4px);
      }

    }

    /* =========================
       ADS
    ========================= */

    .ads-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .ad-box {
      min-height: 70px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* =========================
       STATUS
    ========================= */

    .status-msg {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* =========================
       GTA SA BUTTON
    ========================= */

    .gta-section {
      margin: 15px 0 20px;
      text-align: center;
    }

    .gta-btn {
      display: inline-block;
      width: 85%;
      padding: 11px 14px;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      border-radius: 8px;

      transition:
        background 0.2s,
        transform 0.1s;
    }

    .gta-btn:hover {
      background: var(--green-hover);
    }

    .gta-btn:active {
      transform: scale(0.98);
    }

    /* =========================
       DOWNLOAD BUTTON
    ========================= */

    .download-section {
      margin: 20px 0 25px;
    }

    .btn-dl {
      display: block;
      width: 100%;
      padding: 16px;

      background: var(--accent);
      color: #000;

      text-decoration: none;

      font-weight: 900;
      font-size: 1.1rem;

      border-radius: 10px;

      box-shadow:
        0 4px 15px
        rgba(250, 204, 21, 0.3);

      opacity: 0.5;
      pointer-events: none;

      transition:
        background 0.2s,
        transform 0.1s;
    }

    .btn-dl.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-dl:hover {
      background: var(--accent-hover);
    }

    .btn-dl:active {
      transform: scale(0.98);
    }

    /* =========================
       SOCIAL MEDIA
    ========================= */

    .social-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .social-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);

      padding: 10px 18px;

      border-radius: 8px;

      text-decoration: none;

      font-size: 0.85rem;
      font-weight: bold;

      transition:
        border-color 0.2s,
        color 0.2s;
    }

    .social-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      color: var(--muted);
      font-size: 0.75rem;

      margin-top: 15px;

      border-top:
        1px solid var(--border);

      padding-top: 15px;

      width: 100%;

      line-height: 1.7;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 400px) {

      body {
        padding: 14px;
      }

      .brand {
        font-size: 1.7rem;
      }

      .social-box {
        gap: 8px;
      }

      .social-btn {
        padding: 9px 14px;
      }

    }

  </style>

</head>

<script>

  /* =========================
     JSON SOURCE
  ========================= */

  const API_URL =
    'https://maher.attdes.online/mod.json';


  /* =========================
     SMARTLINK
  ========================= */

  const SMARTLINK =
    'https://www.effectivecpmnetwork.com/qyw9rwgjh?key=ddfcf2ad5cc5d88d9d75ec98a1a7548b';


  /* =========================
     GET ID
     
     مثال:
     mod.html?id=001
  ========================= */

  const urlParams =
    new URLSearchParams(
      window.location.search
    );

  const modId =
    urlParams.get('id');


  const msgEl =
    document.getElementById(
      'statusMsg'
    );


  const dlBtn =
    document.getElementById(
      'dlBtn'
    );


  /* =========================
     CHECK ID
  ========================= */

  if (!modId) {

    msgEl.innerText =
      '⚠️ خطأ: لم يتم تحديد رقم المود في الرابط!';

    msgEl.style.color =
      '#f87171';

  } else {


    /* =========================
       FETCH JSON
    ========================= */

    fetch(API_URL)

      .then(response => {

        if (!response.ok) {

          throw new Error(
            'HTTP ' +
            response.status
          );

        }

        return response.json();

      })


      .then(data => {


        /* =========================
           CHECK MOD
        ========================= */

        if (
          data &&
          Object.prototype.hasOwnProperty.call(
            data,
            modId
          )
        ) {


          const destinationUrl =
            data[modId];


          /* =========================
             CHECK DESTINATION
          ========================= */

          if (
            typeof destinationUrl !==
              'string' ||
            !destinationUrl.trim()
          ) {

            msgEl.innerText =
              '❌ رابط الملف غير صالح.';

            msgEl.style.color =
              '#f87171';

            return;

          }


          /* =========================
             ACTIVATE BUTTON
          ========================= */

          dlBtn.classList.add(
            'active'
          );


          /* =========================
             STATUS
          ========================= */

          msgEl.innerText =
            '✅ الملف جاهز للتحميل أدناه';

          msgEl.style.color =
            '#4ade80';


          /* =========================
             DOWNLOAD CLICK
          ========================= */

          dlBtn.addEventListener(
            'click',
            function(event) {

              event.preventDefault();


              /*
               * فتح رابط الملف في
               * تاب جديد
               */

              const newTab =
                document.createElement(
                  'a'
                );


              newTab.href =
                destinationUrl;


              newTab.target =
                '_blank';


              newTab.rel =
                'noopener noreferrer';


              document.body.appendChild(
                newTab
              );


              newTab.click();


              newTab.remove();


              /*
               * فتح SmartLink
               * في التاب الحالي
               */

              window.location.href =
                SMARTLINK;

            }
          );


        } else {


          /* =========================
             MOD NOT FOUND
          ========================= */

          msgEl.innerText =
            '❌ عذرا، هذا المود غير موجود.';

          msgEl.style.color =
            '#f87171';

        }

      })


      .catch(error => {

        console.error(
          'JSON Error:',
          error
        );


        msgEl.innerText =
          '❌ فشل الاتصال بملف البيانات.';

        msgEl.style.color =
          '#f87171';

      });

  }

</script>
