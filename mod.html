<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHER MODS - Redirecting...</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #ffcc00;
            --text: #ffffff;
            --gray: #333;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card);
            border: 1px solid var(--gray);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        header img {
            max-width: 220px;
            height: auto;
            margin-bottom: 15px;
        }

        h2 {
            color: var(--accent);
            margin-top: 0;
            font-size: 1.2rem;
        }

        .status-box {
            background-color: #262626;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 14px;
        }

        .spinner {
            border: 4px solid rgba(255, 204, 0, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: var(--accent);
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-download {
            display: none;
            background-color: var(--accent);
            color: #000;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        .btn-download:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #dc3545;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="https://attdes.online/header.png" alt="MAHER MODS">
    </header>

    <div id="loader">
        <div class="spinner"></div>
        <h2>جاري تحضير رابط المود...</h2>
        <div class="status-box">يرجى الانتظار، سيتم توجيهك تلقائياً إلى صفحة التحميل.</div>
    </div>

    <div id="errorMessage" class="error-msg">
        <h2>عذراً، الرابط غير صالح أو تم حذفه!</h2>
        <div class="status-box">لم نتمكن من العثور على المود المطلوب.</div>
    </div>

    <a id="downloadBtn" href="#" class="btn-download">🚀 اضغط هنا إذا لم يتم التوجيه تلقائياً</a>
</div>

<script>
    const JSON_URL = 'https://maher.attdes.online/mod.json';

    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function safeAtob(str) {
        try {
            return decodeURIComponent(escape(atob(str.trim())));
        } catch(e) {
            return str;
        }
    }

    async function processRedirect() {
        const modId = getQueryParam('id');

        if (!modId) {
            showError();
            return;
        }

        try {
            const response = await fetch(JSON_URL);
            if (!response.ok) throw new Error();

            const data = await response.json();
            const encryptedUrl = data[modId];

            if (!encryptedUrl) {
                showError();
                return;
            }

            const targetUrl = safeAtob(encryptedUrl);

            const downloadBtn = document.getElementById('downloadBtn');
            downloadBtn.href = targetUrl;
            downloadBtn.style.display = 'inline-block';

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1500);

        } catch (error) {
            showError();
        }
    }

    function showError() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', processRedirect);
</script>
</body>
</html>
